name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Install Firefox for responsive checks
        run: npx playwright install --with-deps firefox

      - name: Check translated layouts and keyboard actions
        run: npm run test:layout
        env:
          LAYOUT_ARTIFACT_DIR: ${{ runner.temp }}/profile-layout

      - name: Save responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-layout
          path: ${{ runner.temp }}/profile-layout/*.png
          retention-days: 7
